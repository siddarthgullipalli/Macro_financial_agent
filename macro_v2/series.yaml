# Macro v2 data pipeline configuration
#
# Column naming in the panel:
#   level   -> <ID>              (e.g. DGS10)
#   other   -> <ID>_<transform>  (e.g. CPIAUCSL_yoy)
#   zscore  -> <column>_z3y      (trailing ~3-year z-score, past data only)
#
# Transforms: level, yoy (% over 1 year), chg_3m (difference over ~3 months),
#             ret_3m (% over ~3 months), chg_4w / pct_4w (weekly series only),
#             diff_1 (change vs previous observation)

pipeline:
  start: "2005-01-01"        # first date kept in the panel
  warmup_years: 4            # extra history pulled for yoy / z-scores / betas
  eval_start: "2006-01-01"   # first month-end in the evaluation set
  horizon_days: 60           # forward window (trading days) for risk labels
  beta_window: 252           # trading days in each rolling sensitivity regression
  beta_min_obs: 200
  zscore_window: 756         # business days (~3 years)
  zscore_min_obs: 252
  splits:                    # by as-of date
    train_end: "2018-12-31"
    val_end: "2021-12-31"
    test_end: "2024-12-31"   # after this -> post_cutoff (held out)

series:
  # ---------------- Policy and rates (daily) ----------------
  - {id: DFF,     name: Effective federal funds rate,        category: policy_rates, freq: D, units: percent, transforms: [level, chg_3m], zscore: [level]}
  - {id: DGS3MO,  name: 3-month Treasury yield,              category: policy_rates, freq: D, units: percent, transforms: [level]}
  - {id: DGS2,    name: 2-year Treasury yield,               category: policy_rates, freq: D, units: percent, transforms: [level, chg_3m]}
  - {id: DGS10,   name: 10-year Treasury yield,              category: policy_rates, freq: D, units: percent, transforms: [level, chg_3m], zscore: [level]}
  - {id: DGS30,   name: 30-year Treasury yield,              category: policy_rates, freq: D, units: percent, transforms: [level]}
  - {id: T10Y2Y,  name: 10Y minus 2Y Treasury spread,        category: policy_rates, freq: D, units: percentage points, transforms: [level, chg_3m], zscore: [level]}
  - {id: T10Y3M,  name: 10Y minus 3M Treasury spread,        category: policy_rates, freq: D, units: percentage points, transforms: [level], zscore: [level]}

  # ---------------- Markets and credit (daily) ----------------
  - {id: VIXCLS,       name: CBOE VIX,                        category: markets_credit, freq: D, units: index, transforms: [level, chg_3m], zscore: [level]}
  - {id: DCOILWTICO,   name: WTI crude oil price,             category: markets_credit, freq: D, units: USD per barrel, transforms: [level, ret_3m, yoy], zscore: [ret_3m]}
  - {id: DTWEXBGS,     name: Broad trade-weighted US dollar index, category: markets_credit, freq: D, units: index, transforms: [level, ret_3m], zscore: [ret_3m]}
  - {id: BAMLH0A0HYM2, name: ICE BofA US high-yield option-adjusted spread, category: markets_credit, freq: D, units: percentage points, transforms: [level, chg_3m], zscore: [level]}
  - {id: BAA10Y,       name: Moody's Baa corporate yield minus 10Y Treasury, category: markets_credit, freq: D, units: percentage points, transforms: [level, chg_3m], zscore: [level]}
  - {id: T5YIE,        name: 5-year breakeven inflation rate, category: inflation, freq: D, units: percent, transforms: [level, chg_3m]}

  # ---------------- Weekly ----------------
  - {id: ICSA,         name: Initial jobless claims,          category: labor,  freq: W, units: claims, transforms: [level, yoy, pct_4w], zscore: [yoy]}
  - {id: NFCI,         name: Chicago Fed National Financial Conditions Index, category: financial_stress, freq: W, units: index, transforms: [level, chg_4w]}
  - {id: STLFSI4,      name: St. Louis Fed Financial Stress Index, category: financial_stress, freq: W, units: index, transforms: [level, chg_4w]}
  - {id: MORTGAGE30US, name: 30-year fixed mortgage rate,     category: housing, freq: W, units: percent, transforms: [level, chg_3m]}

  # ---------------- Monthly ----------------
  - {id: CPIAUCSL, name: CPI all items,                 category: inflation, freq: M, units: index, transforms: [yoy], zscore: [yoy]}
  - {id: CPILFESL, name: Core CPI (ex food and energy), category: inflation, freq: M, units: index, transforms: [yoy]}
  - {id: PCEPILFE, name: Core PCE price index,          category: inflation, freq: M, units: index, transforms: [yoy]}
  - {id: PPIACO,   name: PPI all commodities,           category: inflation, freq: M, units: index, transforms: [yoy]}
  - {id: UNRATE,   name: Unemployment rate,             category: labor,     freq: M, units: percent, transforms: [level, chg_3m]}
  - {id: PAYEMS,   name: Nonfarm payrolls,              category: labor,     freq: M, units: thousands, transforms: [yoy, diff_1]}
  - {id: INDPRO,   name: Industrial production index,   category: growth,    freq: M, units: index, transforms: [yoy]}
  - {id: RSAFS,    name: Retail sales,                  category: growth,    freq: M, units: USD millions, transforms: [yoy]}
  - {id: HOUST,    name: Housing starts,                category: housing,   freq: M, units: thousands of units, transforms: [level, yoy]}
  - {id: UMCSENT,  name: U. Michigan consumer sentiment, category: sentiment, freq: M, units: index, transforms: [level, chg_3m]}
  - {id: CFNAI,    name: Chicago Fed National Activity Index, category: growth, freq: M, units: index, transforms: [level]}

  # ---------------- Quarterly ----------------
  - {id: GDPC1,    name: Real GDP,                      category: growth,    freq: Q, units: billions of chained 2017 USD, transforms: [yoy]}
